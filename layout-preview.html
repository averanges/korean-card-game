<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка компоновки стола</title><style>body{margin:0;background:#111526;color:#f3dfc1;font:13px Georgia}nav{padding:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}select{font:inherit}#frame{position:relative;margin:0 auto}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left}output{display:block;padding:4px 12px 10px}</style><nav><label>Экран <select id="size"><option>1920×1080</option><option>1366×768</option><option selected>1280×720</option><option>1024×768</option><option>390×844</option><option>375×667</option></select></label><label>Карты <select id="cards"><option>6</option><option>10</option><option>15</option><option>20</option></select></label><label>Статус <select id="status"><option value="attack">Атака</option><option selected value="defense">Ход соперника · защита</option><option value="win">Победа</option><option value="lose">Поражение</option></select></label><label><input id="choice" type="checkbox"> Выбор козыря</label><label>Эффекты <select id="effects"><option>0</option><option selected>3</option><option>6</option></select></label></nav><output id="report">Измерение…</output><div id="frame"><iframe id="stage" title="Игровой стол"></iframe></div><script type="module">const size=document.querySelector('#size'),cards=document.querySelector('#cards'),status=document.querySelector('#status'),choice=document.querySelector('#choice'),effects=document.querySelector('#effects'),stage=document.querySelector('#stage'),frame=document.querySelector('#frame'),report=document.querySelector('#report');function resize(){const [w,h]=size.value.split('×').map(Number),scale=Math.min(1,(innerWidth-16)/w,(innerHeight-100)/h);stage.width=w;stage.height=h;stage.style.transform='scale('+scale+')';frame.style.width=w*scale+'px';frame.style.height=h*scale+'px';}function load(){report.textContent='Измерение…';stage.src='/layout-fixture.html?n='+cards.value+'&status='+status.value+'&effects='+effects.value+(choice.checked?'&choice=1':'')+(new URLSearchParams(location.search).has('long')?'&long=1':'');resize();}size.onchange=resize;cards.onchange=status.onchange=choice.onchange=effects.onchange=load;window.addEventListener('resize',resize);window.addEventListener('message',e=>{if(e.source!==stage.contentWindow||e.origin!==location.origin||e.data.type!=='table-layout-report')return;const d=e.data;report.textContent=d.size+' · '+d.cards+' карт · карта стола '+d.cardWidth+' · поле '+d.field+'px · '+(d.issues.length?d.issues.join('; '):'Пересечений и обрезания не обнаружено');});load();</script></html>
