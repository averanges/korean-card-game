name: Deploy GitHub Pages

on:
  push:
    branches: [multiplayer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/multiplayer'
    runs-on: ubuntu-latest
    # Repository variables are available here; environment-only variables belong
    # to the deploy job and must not silently select a different backend.
    env:
      DEPLOY_TARGET: github-pages
      VITE_ROOM_API_BASE: ${{ vars.VITE_ROOM_API_BASE }}
      VITE_ROOM_HEALTHCHECK: ${{ vars.VITE_ROOM_HEALTHCHECK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reject an outdated revision
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/multiplayer | cut -f1)
          test -n "$latest" && test "$GITHUB_SHA" = "$latest" || { echo 'Build the current multiplayer revision using Run workflow, not Re-run jobs on an old run.'; exit 1; }
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Test production backend guard
        run: node --test scripts/room-build-config.test.mjs
      - name: Build GitHub Pages site
        run: npm run build
      - name: Verify Pages build
        run: node scripts/check-pages-build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
